name: aragog

volumes:
  qdrant_data:

x-vllm: &vllm
  image: vllm/vllm-openai:v0.31.0
  restart: unless-stopped
  ipc: host
  environment:
    VLLM_NO_USAGE_STATS: "1"
  volumes:
    - ./data/huggingface:/root/.cache/huggingface
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["0"]
            capabilities: [gpu]

services:

  server:
    build: .
    container_name: aragog
    restart: unless-stopped
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # rich wraps log records at 80 columns without a TTY
      FASTMCP_ENABLE_RICH_LOGGING: "false"
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  qdrant:
    image: docker.io/qdrant/qdrant:v1.20.0
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: INFO
      QDRANT__SERVICE__API_KEY: ${QDRANT_TOKEN}
      QDRANT__TELEMETRY_DISABLED: "true"

  embedder:
    <<: *vllm
    container_name: embedder
    ports:
      - "127.0.0.1:8001:8000"
    command: >
      ${DENSE_EMBEDDING_MODEL}
      --served-model-name=${DENSE_EMBEDDING_MODEL}
      --api-key=${DENSE_EMBEDDING_TOKEN}
      --runner=pooling
      --convert=embed
      --gpu-memory-utilization=0.20
      --max-model-len=8192
      --max-num-seqs=256

  reranker:
    <<: *vllm
    container_name: reranker
    ports:
      - "127.0.0.1:8002:8000"
    command: >
      ${RERANKER_MODEL}
      --served-model-name=${RERANKER_MODEL}
      --api-key=${RERANKER_TOKEN}
      --runner=pooling
      --convert=classify
      --gpu-memory-utilization=0.20
      --max-model-len=8192
      --max-num-seqs=256
