    "fastmcp>=3.4.7,<4",
    "haystack-ai>=3.1.0",
    "minio>=7.2.20",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "qdrant-haystack>=10.5.0",
    "vllm-haystack>=1.3.0",
]
